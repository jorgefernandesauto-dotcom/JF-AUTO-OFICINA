{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Definições da oficina</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-6"><label>Nome da oficina</label><input name="company_name" value="{{s.company_name}}" class="form-control"></div><div class="col-md-3"><label>NIF</label><input name="nif" value="{{s.nif}}" class="form-control"></div><div class="col-md-3"><label>IVA padrão (%)</label><input name="vat" value="{{s.vat}}" type="number" step=".01" class="form-control"></div><div class="col-md-4"><label>Telefone</label><input name="phone" value="{{s.phone}}" class="form-control"></div><div class="col-md-4"><label>Email</label><input name="email" value="{{s.email}}" class="form-control"></div><div class="col-md-4"><label>Morada</label><input name="address" value="{{s.address}}" class="form-control"></div></div><button class="btn btn-dark mt-4">Guardar definições</button></form><div class="cardx p-4 mt-4"><h5>Segurança</h5><div class="muted mb-3">Altere a palavra-passe do utilizador com que está ligado.</div><form method="post" action="/settings/password" class="row g-3"><div class="col-md-4"><label>Palavra-passe atual</label><input name="old_password" type="password" required class="form-control"></div><div class="col-md-4"><label>Nova palavra-passe</label><input name="new_password" type="password" minlength="8" required class="form-control"></div><div class="col-md-4 d-flex align-items-end"><button class="btn btn-dark">Alterar palavra-passe</button></div></form></div>{% endblock %}
