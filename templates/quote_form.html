{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><div><div class="page-title">Novo orçamento</div><div class="muted">Os preços podem ser carregados diretamente do catálogo da oficina.</div></div></div>
<form method="post"><div class="cardx p-4 mb-3"><div class="row g-3"><div class="col-md-7"><label>Viatura</label><select name="vehicle_id" class="form-select" required><option value="">Selecionar...</option>{% for v in vehicles %}<option value="{{v.id}}">{{v.plate}} — {{v.client.name}} — {{v.brand}} {{v.model}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Válido até</label><input name="valid_until" type="date" class="form-control"></div><div class="col-md-2"><label>IVA %</label><input name="vat" value="23" type="number" step=".01" class="form-control"></div></div></div>
<div class="cardx p-4 mb-3"><div class="d-flex justify-content-between align-items-center"><div><h5 class="mb-1">Itens do orçamento</h5><div class="muted">Seleciona uma peça ou serviço e o preço de venda é preenchido automaticamente.</div></div><button type="button" class="btn btn-sm btn-dark" onclick="add()">+ Linha</button></div><div class="table-responsive mt-3"><table class="table align-middle" id="qt"><thead><tr><th style="width:22%">Catálogo</th><th>Tipo</th><th>Descrição</th><th>Referência</th><th>Qtd.</th><th>Preço</th><th></th></tr></thead><tbody></tbody></table></div><div class="row"><div class="col-md-3"><label>Desconto (€)</label><input name="discount" value="0" step=".01" type="number" class="form-control"></div></div><label class="mt-3">Observações</label><textarea name="notes" class="form-control"></textarea></div><button class="btn btn-dark">Criar orçamento</button></form>
<script>
function rowHtml(){return `<tr><td><div class="input-group"><input class="form-control catalog-search" list="catalog-options" placeholder="Pesquisar peça ou serviço..." autocomplete="off"></div></td><td><select name="item_type[]" class="form-select"><option>Peça</option><option>Mão de obra</option></select></td><td><input name="item_description[]" class="form-control"></td><td><input name="item_reference[]" class="form-control"></td><td><input name="item_quantity[]" value="1" step=".01" type="number" class="form-control"></td><td><input name="item_price[]" value="0" step=".01" type="number" class="form-control"></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">×</button></td></tr>`}
function add(){let tbody=document.querySelector('#qt tbody');tbody.insertAdjacentHTML('beforeend',rowHtml());bindCatalogRow(tbody.lastElementChild);}
add();
</script>{% endblock %}
