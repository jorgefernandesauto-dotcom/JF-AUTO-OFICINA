{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><div><div class="page-title">{{'Editar orçamento' if edit else 'Novo orçamento'}}</div><div class="muted">Peças e serviços podem ser escolhidos do catálogo.</div></div></div><form method="post"><div class="cardx p-4 mb-3"><div class="row g-3"><div class="col-md-7"><label>Viatura</label><select name="vehicle_id" class="form-select" required><option value="">Selecionar...</option>{% for v in vehicles %}<option value="{{v.id}}" {% if q and q.vehicle_id==v.id %}selected{% endif %}>{{v.plate}} — {{v.client.name}} — {{v.brand}} {{v.model}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Válido até</label><input name="valid_until" type="date" value="{{q.valid_until.isoformat() if q and q.valid_until else ''}}" class="form-control"></div><div class="col-md-2"><label>IVA %</label><input name="vat" value="{{q.vat if q else 23}}" type="number" step=".01" class="form-control"></div></div></div><div class="cardx p-4 mb-3"><div class="d-flex justify-content-between"><h5>Itens</h5><button type="button" class="btn btn-sm btn-dark" onclick="add()">+ Linha</button></div><div class="table-responsive mt-3"><table class="table" id="qt"><thead><tr><th>Catálogo</th><th>Tipo</th><th>Descrição</th><th>Referência</th><th>Qtd.</th><th>Preço</th><th>IVA</th><th></th></tr></thead><tbody>{% if q %}{% for i in q.items %}<tr><td><input class="form-control catalog-search" placeholder="Pesquisar..."></td><td><select name="item_type[]" class="form-select"><option {% if i.item_type=='Peça' %}selected{% endif %}>Peça</option><option {% if i.item_type=='Mão de obra' %}selected{% endif %}>Mão de obra</option></select></td><td><input name="item_description[]" value="{{i.description}}" class="form-control" required></td><td><input name="item_reference[]" value="{{i.reference or ''}}" class="form-control"></td><td><input name="item_quantity[]" value="{{i.quantity}}" step=".01" type="number" class="form-control"></td><td><input name="item_price[]" value="{{i.unit_price}}" step=".01" type="number" class="form-control"></td><td><input name="item_vat[]" value="{{i.vat}}" step=".01" type="number" class="form-control"></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">×</button></td></tr>{% endfor %}{% endif %}</tbody></table></div><div class="row g-3"><div class="col-md-3"><label>Desconto (€)</label><input name="discount" value="{{q.discount if q else 0}}" step=".01" type="number" class="form-control"></div><div class="col-12"><label>Observações</label><textarea name="notes" class="form-control">{{q.notes if q else ''}}</textarea></div></div></div><button class="btn btn-dark">{{'Guardar alterações' if edit else 'Criar orçamento'}}</button></form><script>function row(){return `<tr><td><input class="form-control catalog-search" placeholder="Pesquisar..."></td><td><select name="item_type[]" class="form-select"><option>Peça</option><option>Mão de obra</option></select></td><td><input name="item_description[]" class="form-control" required></td><td><input name="item_reference[]" class="form-control"></td><td><input name="item_quantity[]" value="1" step=".01" type="number" class="form-control"></td><td><input name="item_price[]" value="0" step=".01" type="number" class="form-control"></td><td><input name="item_vat[]" value="23" step=".01" type="number" class="form-control"></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">×</button></td></tr>`}function add(){let t=document.querySelector('#qt tbody');t.insertAdjacentHTML('beforeend',row());bindCatalogRow(t.lastElementChild)}{% if not q %}add();{% endif %}</script>{% endblock %}
