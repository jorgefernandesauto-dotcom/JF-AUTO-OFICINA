{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Nova marcação</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-4"><label>Data e hora de início</label><input name="start_at" type="datetime-local" required class="form-control"></div><div class="col-md-4"><label>Data e hora de fim</label><input name="end_at" type="datetime-local" class="form-control"></div><div class="col-md-4"><label>Cliente</label><input name="client_name" required class="form-control"></div><div class="col-md-4"><label>Matrícula</label><input name="plate" class="form-control"></div><div class="col-md-5"><label>Serviço</label><input name="service" class="form-control"></div><div class="col-md-3"><label>Mecânico</label><input name="mechanic" class="form-control"></div><div class="col-md-2"><label>Estado</label><select name="status" class="form-select"><option>Marcada</option><option>Confirmada</option><option>Concluída</option><option>Cancelada</option></select></div></div><button class="btn btn-dark mt-4">Guardar marcação</button></form>{% endblock %}
