{% extends "base.html" %}{% block content %}<div class="page-title mb-3">{{'Editar marcação' if edit else 'Nova marcação'}}</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-3"><label>Início</label><input name="start_at" type="datetime-local" value="{{a.start_at.strftime('%Y-%m-%dT%H:%M') if a else ''}}" required class="form-control"></div><div class="col-md-3"><label>Fim</label><input name="end_at" type="datetime-local" value="{{a.end_at.strftime('%Y-%m-%dT%H:%M') if a and a.end_at else ''}}" class="form-control"></div><div class="col-md-3"><label>Cliente</label><input name="client_name" value="{{a.client_name if a else ''}}" required class="form-control"></div><div class="col-md-3"><label>Matrícula</label><input name="plate" value="{{a.plate if a else ''}}" class="form-control"></div><div class="col-md-6"><label>Serviço</label><input name="service" value="{{a.service if a else ''}}" class="form-control"></div><div class="col-md-3"><label>Mecânico</label><input name="mechanic" value="{{a.mechanic if a else ''}}" class="form-control"></div><div class="col-md-3"><label>Estado</label><select name="status" class="form-select">{% for s in ['Marcada','Confirmada','Concluída','Cancelada'] %}<option {% if a and a.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></div></div><button class="btn btn-dark mt-4">Guardar</button></form>{% endblock %}
