{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Novo veículo</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-4"><label>Matrícula</label><input name="plate" required class="form-control"></div><div class="col-md-4"><label>Marca</label><input name="brand" class="form-control"></div><div class="col-md-4"><label>Modelo</label><input name="model" class="form-control"></div><div class="col-md-3"><label>Ano</label><input name="year" type="number" class="form-control"></div><div class="col-md-3"><label>Quilometragem</label><input name="km" type="number" class="form-control"></div><div class="col-md-3"><label>Combustível</label><select name="fuel" class="form-select"><option></option><option>Gasolina</option><option>Diesel</option><option>Híbrido</option><option>Elétrico</option><option>GPL</option></select></div><div class="col-md-3"><label>VIN</label><input name="vin" class="form-control"></div><div class="col-md-8"><label>Cliente</label><select name="client_id" required class="form-select">{% for c in clients %}<option value="{{c.id}}">{{c.name}} — {{c.phone or ''}}</option>{% endfor %}</select></div><div class="col-12"><label>Notas da viatura</label><textarea name="notes" class="form-control" rows="3" placeholder="Observações permanentes da viatura...">{{v.notes or "" if v else ""}}</textarea></div></div><button class="btn btn-dark mt-4">Guardar veículo</button></form>{% endblock %}
