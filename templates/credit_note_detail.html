{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><div><div class="page-title">{{credit.number}}</div><div class="muted">Nota de crédito</div></div><a class="btn btn-dark" href="/credit-notes/{{credit.id}}/print" target="_blank">Imprimir</a></div><div class="cardx p-4"><img src="{{url_for('static',filename='img/jf-auto-logo.png')}}" class="logo-print mb-3"><h4>{{credit.client_name or 'Cliente'}}</h4><p>Fatura de origem: {{credit.invoice.number if credit.invoice else '-'}}</p><p>Motivo: {{credit.reason or '-'}}</p><h3>Valor: {{credit.amount|eur}}</h3></div>{% endblock %}
