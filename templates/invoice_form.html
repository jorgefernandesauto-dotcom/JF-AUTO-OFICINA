{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Nova fatura simples</div><form method="post"><div class="cardx p-4 mb-3"><div class="row g-3"><div class="col-md-6"><label>Cliente</label><select name="client_id" required class="form-select"><option value="">Selecionar...</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}}{% if c.nif %} — NIF {{c.nif}}{% endif %}</option>{% endfor %}</select></div><div class="col-md-6"><label>Viatura (opcional)</label><select name="vehicle_id" class="form-select"><option value="">Sem viatura</option>{% for v in vehicles %}<option value="{{v.id}}">{{v.plate}} — {{v.client.name}}</option>{% endfor %}</select></div></div></div><div class="cardx p-4 mb-3"><div class="d-flex justify-content-between"><h5>Itens</h5><button type="button" class="btn btn-sm btn-dark" onclick="add()">+ Linha</button></div><table class="table" id="it"><thead><tr><th>Catálogo</th><th>Tipo</th><th>Descrição</th><th>Referência</th><th>Qtd.</th><th>Preço</th><th></th></tr></thead><tbody></tbody></table><div class="row"><div class="col-md-3"><label>Desconto (€)</label><input name="discount" value="0" step=".01" type="number" class="form-control"></div><div class="col-md-3"><label>IVA %</label><input name="vat" value="23" step=".01" type="number" class="form-control"></div></div><label class="mt-3">Observações</label><textarea name="notes" class="form-control"></textarea></div><button class="btn btn-dark">Criar fatura</button></form><script>function rowHtml(){return `<tr><td><input class="form-control catalog-search" list="catalog-options" placeholder="Pesquisar..." autocomplete="off"></td><td><select name="item_type[]" class="form-select"><option>Peça</option><option>Mão de obra</option></select></td><td><input name="item_description[]" class="form-control" required></td><td><input name="item_reference[]" class="form-control"></td><td><input name="item_quantity[]" value="1" step=".01" type="number" class="form-control"></td><td><input name="item_price[]" value="0" step=".01" type="number" class="form-control"></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">×</button></td></tr>`}function add(){let b=document.querySelector('#it tbody');b.insertAdjacentHTML('beforeend',rowHtml());bindCatalogRow(b.lastElementChild)}add();</script>{% endblock %}
