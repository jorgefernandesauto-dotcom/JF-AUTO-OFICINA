{% extends "base.html" %}{% block content %}<div class="page-title mb-3">{{'Editar fatura simples' if edit else 'Nova fatura simples'}}</div><form method="post"><div class="cardx p-4 mb-3"><div class="row g-3"><div class="col-md-4"><label>Cliente</label><select name="client_id" class="form-select"><option value="">Selecionar cliente existente</option>{% for c in clients or [] %}<option value="{{c.id}}" {% if inv and inv.client_id==c.id %}selected{% endif %}>{{c.name}}{% if c.nif %} · {{c.nif}}{% endif %}</option>{% endfor %}</select><input name="client_name" value="{{inv.client_name if inv else ''}}" placeholder="Ou escrever nome do cliente" class="form-control mt-2"></div><div class="col-md-2"><label>NIF</label><input name="nif" value="{{inv.nif if inv else ''}}" class="form-control"></div><div class="col-md-3"><label>Telefone</label><input name="phone" value="{{inv.phone if inv else ''}}" class="form-control"></div><div class="col-md-3"><label>Viatura</label><input name="vehicle_info" value="{{inv.vehicle_info if inv else ''}}" placeholder="Matrícula / viatura" class="form-control"></div><div class="col-md-2"><label>Quilómetros</label><input name="km" value="{{inv.km if inv else 0}}" type="number" min="0" step="1" class="form-control" placeholder="km"></div><div class="col-md-3"><label>Vencimento</label><input name="due_date" value="{{inv.due_date.isoformat() if inv and inv.due_date else ""}}" type="date" class="form-control"></div><div class="col-12"><label>Morada</label><input name="address" value="{{inv.address if inv else ''}}" class="form-control"></div></div></div><div class="cardx p-4 mb-3"><div class="d-flex justify-content-between"><h5>Linhas</h5><button type="button" class="btn btn-sm btn-dark" onclick="add()">+ Linha</button></div><table class="table mt-3" id="it"><thead><tr><th>Tipo</th><th>Descrição</th><th>Referência</th><th>Qtd.</th><th>Preço</th><th>IVA</th><th></th></tr></thead><tbody>{% if inv %}{% for i in inv.items %}<tr><td><select name="item_type[]" class="form-select"><option {% if i.item_type=='Peça' %}selected{% endif %}>Peça</option><option {% if i.item_type=='Mão de obra' %}selected{% endif %}>Mão de obra</option></select></td><td><input name="item_description[]" value="{{i.description}}" class="form-control" required></td><td><input name="item_reference[]" value="{{i.reference or ''}}" class="form-control"></td><td><input name="item_quantity[]" value="{{i.quantity}}" type="number" step=".01" class="form-control"></td><td><input name="item_price[]" value="{{i.unit_price}}" type="number" step=".01" class="form-control"></td><td><input name="item_vat[]" value="{{i.vat}}" type="number" step=".01" class="form-control"></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">×</button></td></tr>{% endfor %}{% endif %}</tbody></table><div class="row g-3"><div class="col-md-3"><label>Desconto (€)</label><input name="discount" value="{{inv.discount if inv else 0}}" type="number" step=".01" class="form-control"></div><div class="col-md-2"><label>IVA %</label><input name="vat" value="{{inv.vat if inv else 23}}" type="number" step=".01" class="form-control"></div><div class="col-12"><label>Observações</label><textarea name="notes" class="form-control">{{inv.notes if inv else ''}}</textarea></div></div></div><button class="btn btn-dark">{{'Guardar alterações' if edit else 'Criar fatura'}}</button></form><script>function add(){document.querySelector('#it tbody').insertAdjacentHTML('beforeend',`<tr><td><select name="item_type[]" class="form-select"><option>Peça</option><option>Mão de obra</option></select></td><td><input name="item_description[]" class="form-control" required></td><td><input name="item_reference[]" class="form-control"></td><td><input name="item_quantity[]" value="1" type="number" step=".01" class="form-control"></td><td><input name="item_price[]" value="0" type="number" step=".01" class="form-control"></td><td><input name="item_vat[]" value="23" type="number" step=".01" class="form-control"></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">×</button></td></tr>`)}{% if not inv %}add();{% endif %}</script>{% endblock %}
