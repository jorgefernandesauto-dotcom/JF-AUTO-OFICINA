{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><div class="page-title">Veículos</div><a class="btn btn-dark" href="/vehicles/new">+ Novo veículo</a></div><form class="mb-3"><input name="q" value="{{q}}" class="form-control" placeholder="Pesquisar matrícula, marca ou modelo"></form><div class="cardx"><table class="table mb-0"><tr><th>Matrícula</th><th>Veículo</th><th>Cliente</th><th>Ano</th><th>KM</th><th>Combustível</th></tr>{% for v in vehicles %}<tr><td><strong>{{v.plate}}</strong></td><td>{{v.brand}} {{v.model}}</td><td>{{v.client.name}}</td><td>{{v.year or '-'}}</td><td>{{v.km or 0}}</td><td>{{v.fuel or '-'}}</td></tr>{% else %}<tr><td colspan="6" class="empty">Sem veículos.</td></tr>{% endfor %}</table></div>{% endblock %}
