{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Novo recibo</div><form method="post"><div class="cardx p-4"><div class="row g-3"><div class="col-md-7"><label>Fatura</label><select name="invoice_id" class="form-select" required>{% for i in invoices %}<option value="{{i.id}}" {% if request.args.get('invoice_id')==i.id|string %}selected{% endif %}>{{i.number}} — {{i.client_name or 'Sem cliente'}} — em dívida {{invoice_balance(i)|eur}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Valor recebido (€)</label><input name="amount" type="number" step=".01" min="0.01" class="form-control" required></div><div class="col-md-2"><label>Pagamento</label><select name="payment_method" class="form-select"><option>Transferência</option><option>Dinheiro</option><option>Multibanco</option><option>Cartão</option><option>Outro</option></select></div><div class="col-12"><label>Observações</label><textarea name="notes" class="form-control"></textarea></div></div></div><button class="btn btn-dark mt-3">Criar recibo</button></form>{% endblock %}
