{% extends "base.html" %}{% block content %}<div class="page-title mb-3">{{'Editar peça / stock' if edit else 'Nova peça'}}</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-3"><label>Referência</label><input name="code" value="{{p.code if p else ''}}" class="form-control" required></div><div class="col-md-5"><label>Descrição</label><input name="description" value="{{p.description if p else ''}}" class="form-control" required></div><div class="col-md-4"><label>Fornecedor</label><input name="supplier" value="{{p.supplier if p else ''}}" class="form-control"></div><div class="col-md-3"><label>Preço compra</label><input name="purchase_price" value="{{p.purchase_price if p else 0}}" type="number" step=".01" class="form-control"></div><div class="col-md-3"><label>Preço venda</label><input name="sale_price" value="{{p.sale_price if p else 0}}" type="number" step=".01" class="form-control"></div><div class="col-md-2"><label>Stock</label><input name="quantity" value="{{p.quantity if p else 0}}" type="number" class="form-control"></div><div class="col-md-2"><label>Stock mínimo</label><input name="minimum_stock" value="{{p.minimum_stock if p else 0}}" type="number" class="form-control"></div><div class="col-md-2"><label>IVA %</label><input name="vat" value="{{p.vat if p else 23}}" type="number" step=".01" class="form-control"></div></div><button class="btn btn-dark mt-4">{{'Guardar alterações' if edit else 'Criar peça'}}</button></form>{% endblock %}
