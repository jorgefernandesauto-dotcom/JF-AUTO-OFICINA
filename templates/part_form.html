{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Nova peça</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-4"><label>Referência / código</label><input name="code" required class="form-control"></div><div class="col-md-8"><label>Descrição</label><input name="description" required class="form-control"></div><div class="col-md-5"><label>Fornecedor</label><input name="supplier" class="form-control"></div><div class="col-md-3"><label>Preço de compra (€)</label><input name="purchase_price" value="0" type="number" step=".01" class="form-control"></div><div class="col-md-3"><label>Preço de venda (€)</label><input name="sale_price" value="0" type="number" step=".01" class="form-control"></div><div class="col-md-1"><label>IVA %</label><input name="vat" value="23" type="number" step=".01" class="form-control"></div><div class="col-md-3"><label>Quantidade</label><input name="quantity" value="0" type="number" class="form-control"></div><div class="col-md-3"><label>Stock mínimo</label><input name="minimum_stock" value="0" type="number" class="form-control"></div></div><button class="btn btn-dark mt-4">Guardar peça</button></form>{% endblock %}
