<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — JF Auto Mecânica"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{background:#fff;border:1px solid #e5e5e8;border-radius:18px;padding:32px;width:min(420px,92vw);box-shadow:0 8px 30px #0001}.logo{max-width:230px;max-height:90px;object-fit:contain;margin-bottom:20px}.btnx{background:#7357ff;color:#fff;border:0}</style></head><body><div class="box text-center"><img class="logo" src="{{url_for('static',filename='img/jf-auto-logo.png')}}" alt="JF Auto Mecânica"><h4 class="mb-4">Acesso ao programa</h4>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert alert-danger py-2">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="next" value="{{request.args.get('next','')}}"><div class="mb-3 text-start"><label class="form-label">Nome de utilizador</label><input class="form-control" name="username" required autofocus></div><div class="mb-3 text-start"><label class="form-label">Palavra-passe</label><input class="form-control" type="password" name="password" required></div><button class="btn btnx w-100 py-2">Entrar</button></form></div></body></html>
