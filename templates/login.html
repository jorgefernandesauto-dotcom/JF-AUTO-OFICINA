<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — JF Auto Mecânica</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#14131f;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{background:#fff;width:390px;padding:32px;border-radius:18px}.logo{width:100%;height:100px;object-fit:contain}</style></head><body><div class="box"><img class="logo" src="{{url_for('static',filename='img/jf-auto-logo.png')}}"><h4 class="text-center mt-3">Acesso ao programa</h4>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,m in messages %}<div class="alert alert-danger">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label class="mt-2">Nome de utilizador</label><input name="username" class="form-control" required autofocus><label class="mt-3">Palavra-passe</label><input name="password" type="password" class="form-control" required><button class="btn btn-dark w-100 mt-4">Entrar</button></form></div></body></html>
