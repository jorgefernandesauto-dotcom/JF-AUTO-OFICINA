{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><div><div class="page-title">{{receipt.number}}</div><div class="muted">Recibo de pagamento</div></div><a class="btn btn-dark" href="/receipts/{{receipt.id}}/print" target="_blank">Imprimir</a></div><div class="cardx p-4"><h4>{{receipt.client_name or 'Cliente'}}</h4><p>Fatura: {{receipt.invoice.number if receipt.invoice else '-'}}</p><p>Valor recebido: <b>{{receipt.amount|eur}}</b></p><p>Meio de pagamento: {{receipt.payment_method}}</p></div>{% endblock %}
