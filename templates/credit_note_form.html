{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Nova nota de crédito</div><form method="post"><div class="cardx p-4"><div class="row g-3"><div class="col-md-7"><label>Fatura de origem</label><select name="invoice_id" class="form-select" required>{% for i in invoices %}<option value="{{i.id}}" {% if request.args.get('invoice_id')==i.id|string %}selected{% endif %}>{{i.number}} — {{i.client_name or 'Sem cliente'}} — disponível {{(invoice_total(i)-invoice_credits(i))|eur}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Valor (€)</label><input name="amount" type="number" step=".01" min="0.01" class="form-control" required></div><div class="col-md-2"><label>Motivo</label><input name="reason" class="form-control" required></div><div class="col-12"><label>Observações</label><textarea name="notes" class="form-control"></textarea></div></div></div><button class="btn btn-dark mt-3">Criar nota de crédito</button></form>{% endblock %}
