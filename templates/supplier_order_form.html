{% extends "base.html" %}{% block content %}<div class="page-title mb-3">Nova encomenda ao fornecedor</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-5"><label>Fornecedor</label><input name="supplier" class="form-control" required></div><div class="col-md-3"><label>Estado</label><select name="status" class="form-select"><option>Encomendada</option><option>Em trânsito</option></select></div><div class="col-md-4"><label>Data prevista</label><input name="expected_at" type="date" class="form-control"></div><div class="col-12"><label>Notas</label><textarea name="notes" class="form-control"></textarea></div></div><hr><h5>Peças</h5><div id="items"><div class="row g-2 item-row mb-2"><div class="col-md-5"><select name="item_part_id[]" class="form-select" onchange="setPart(this)"><option value="">— selecionar peça —</option>{% for p in parts %}<option value="{{p.id}}" data-desc="{{p.description}}" data-cost="{{p.purchase_price or 0}}">{{p.code}} — {{p.description}}</option>{% endfor %}</select><input name="item_description[]" class="form-control mt-2" placeholder="Descrição" required></div><div class="col-md-2"><input name="item_quantity[]" type="number" step=".01" value="1" class="form-control" placeholder="Qtd."></div><div class="col-md-3"><input name="item_cost[]" type="number" step=".01" value="0" class="form-control" placeholder="Custo unitário"></div><div class="col-md-2"><button type="button" class="btn btn-outline-dark w-100" onclick="this.closest('.item-row').remove()">Remover</button></div></div></div><button type="button" class="btn btn-outline-secondary" onclick="addRow()">+ Adicionar peça</button><div class="mt-4"><button class="btn btn-dark">Criar encomenda</button></div></form><script>function setPart(s){let r=s.closest('.item-row');let o=s.options[s.selectedIndex];if(o.value){r.querySelector('[name="item_description[]"]').value=o.dataset.desc;r.querySelector('[name="item_cost[]"]').value=o.dataset.cost}}function addRow(){let x=document.querySelector('.item-row').cloneNode(true);x.querySelectorAll('input').forEach(i=>i.value=i.name.includes('quantity')?'1':'');x.querySelector('select').selectedIndex=0;document.getElementById('items').appendChild(x)}</script>{% endblock %}
