{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><div class="page-title">Clientes</div><a class="btn btn-dark" href="/clients/new">+ Novo cliente</a></div><form class="mb-3"><input name="q" value="{{q}}" class="form-control" placeholder="Pesquisar nome, NIF ou telefone"></form><div class="cardx"><table class="table mb-0"><tr><th>Nome</th><th>NIF</th><th>Telefone</th><th>Email</th><th>Viaturas</th></tr>{% for c in clients %}<tr><td><strong>{{c.name}}</strong></td><td>{{c.nif or '-'}}</td><td>{{c.phone or '-'}}</td><td>{{c.email or '-'}}</td><td>{{c.vehicles|length}}</td></tr>{% else %}<tr><td colspan="5" class="empty">Sem clientes.</td></tr>{% endfor %}</table></div>{% endblock %}
