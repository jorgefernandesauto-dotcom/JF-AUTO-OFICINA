{% extends "base.html" %}{% block content %}<div class="page-title mb-3">{{title}}</div><form method="post" class="cardx p-4"><div class="row g-3"><div class="col-md-2"><label>Tipo</label><select name="item_type" class="form-select"><option {% if i.item_type=='Peça' %}selected{% endif %}>Peça</option><option {% if i.item_type=='Mão de obra' %}selected{% endif %}>Mão de obra</option></select></div><div class="col-md-4"><label>Descrição</label><input name="description" value="{{i.description}}" class="form-control" required></div><div class="col-md-2"><label>Referência</label><input name="reference" value="{{i.reference or ''}}" class="form-control"></div><div class="col-md-1"><label>Qtd.</label><input name="quantity" value="{{i.quantity}}" type="number" step=".01" class="form-control"></div><div class="col-md-2"><label>Preço</label><input name="unit_price" value="{{i.unit_price}}" type="number" step=".01" class="form-control"></div><div class="col-md-1"><label>IVA</label><input name="vat" value="{{i.vat}}" type="number" step=".01" class="form-control"></div></div><button class="btn btn-dark mt-4">Guardar</button> <a class="btn btn-outline-secondary mt-4" href="{{back}}">Cancelar</a></form>{% endblock %}
