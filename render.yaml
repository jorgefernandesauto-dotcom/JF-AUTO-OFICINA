services:
  - type: web
    name: oficina-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oficina-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: oficina-db
    databaseName: oficina
    user: oficina
